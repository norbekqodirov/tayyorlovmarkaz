version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: tayyorlovmarkaz-postgres
    restart: always
    environment:
      POSTGRES_USER: tayyorlov
      POSTGRES_PASSWORD: tayyorlov123
      POSTGRES_DB: tayyorlovmarkaz
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tayyorlov -d tayyorlovmarkaz"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: tayyorlovmarkaz-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  redisdata:
